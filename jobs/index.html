<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Watch — NLK Automation</title>
<meta name="description" content="NLK Automation job board — operations, management, logistics, and supply chain roles in Winnipeg and Manitoba.">
<link rel="canonical" href="https://wademillerbombers.com/jobs/">
<meta property="og:title" content="Job Watch — NLK Automation">
<meta property="og:description" content="NLK Automation job board — operations, management, logistics, and supply chain roles in Winnipeg and Manitoba.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wademillerbombers.com/jobs/">
<style>
  :root {
    --bg: #0b1626;
    --bg-card: #0e1b2e;
    --bg-row: #132542;
    --bg-row-hover: #1a2f4d;
    --border: #1f2a44;
    --text: #f4f4f5;
    --text-dim: #a1a1aa;
    --text-faint: #71717a;
    --accent: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --teal: #06b6d4;
    --red: #ff4747;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 32px 20px 64px;
  }
  .container { max-width: 1200px; margin: 0 auto; }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 50%, var(--accent-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .brand .tag {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .meta { text-align: right; font-size: 12px; color: var(--text-dim); }
  .meta .updated { color: var(--accent); }

  /* Stats bar */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat .num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat .label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 8px;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input[type="search"] {
    flex: 1;
    min-width: 220px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .controls input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .controls select, .controls button {
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .controls button.active {
    background: var(--accent);
    color: #04120c;
    border-color: var(--accent);
    font-weight: 600;
  }
  .controls button:hover { border-color: var(--accent); }
  .filter-group { display: flex; gap: 6px; }

  /* Table */
  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--bg-row); }
  th {
    text-align: left;
    padding: 12px 14px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--accent); }
  td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
  tbody tr { transition: background 0.1s; cursor: pointer; }
  tbody tr:hover { background: var(--bg-row-hover); }
  tbody tr.is-new { background: rgba(16, 185, 129, 0.05); }
  tbody tr.is-new:hover { background: rgba(16, 185, 129, 0.10); }

  .role-cell a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .role-cell a::after {
    content: " ↗";
    color: var(--text-faint);
    font-size: 11px;
    margin-left: 2px;
    transition: color 0.15s;
  }
  .role-cell a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .role-cell a:hover::after { color: var(--accent); }

  .new-badge {
    display: inline-block;
    background: var(--accent);
    color: #04120c;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    vertical-align: middle;
  }
  .source-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .source-linkedin {
    background: rgba(10, 102, 194, 0.15);
    color: #6ba3e0;
    border: 1px solid rgba(10, 102, 194, 0.3);
  }
  .source-jobbank {
    background: rgba(6, 182, 212, 0.15);
    color: #5dd5e8;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }
  .source-eluta {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.3);
  }
  .source-mbgov {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }
  .pension-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.3px;
    background: rgba(16, 185, 129, 0.12);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.35);
    white-space: nowrap;
    margin-left: 6px;
  }
  .salary-cell { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .salary-cell .badge { font-weight: 600; }
  .salary-cell .badge-100k { color: var(--accent); }
  .salary-cell .badge-75k { color: var(--teal); }
  .salary-cell .badge-under { color: var(--red); }
  .salary-cell .badge-na { color: var(--text-faint); }
  .match-cell { text-align: center; }
  .match-bar {
    display: inline-block;
    width: 60px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    vertical-align: middle;
  }
  .match-bar-fill { height: 100%; background: var(--accent); }
  .match-num {
    color: var(--text-dim);
    font-size: 11px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }
  .date-cell { color: var(--text-dim); white-space: nowrap; font-size: 12px; }
  .company-cell { color: var(--text-dim); white-space: nowrap; }
  .loc-cell { color: var(--text-dim); white-space: nowrap; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-dim);
  }

  /* Footer */
  footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 720px) {
    body { padding: 20px 12px 48px; }
    .brand h1 { font-size: 20px; }
    th, td { padding: 10px 10px; font-size: 12px; }
    .hide-mobile { display: none; }
    .match-bar { display: none; }
    .meta { text-align: left; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>Job Watch</h1>
      <span class="tag">NLK Automation</span>
    </div>
    <div class="meta">
      <div class="updated" id="updated">Loading…</div>
      <div>Winnipeg / Manitoba · $80K+</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Search title or company…" autocomplete="off">
    <div class="filter-group" data-filter="status">
      <button data-status="all" class="active">All</button>
      <button data-status="new">New</button>
      <button data-status="ongoing">Ongoing</button>
    </div>
    <div class="filter-group" data-filter="source">
      <button data-source="all" class="active">Any Source</button>
      <button data-source="LinkedIn">LinkedIn</button>
      <button data-source="Job Bank">Job Bank</button>
      <button data-source="Eluta">Eluta</button>
      <button data-source="MB Gov">MB Gov</button>
    </div>
    <div class="filter-group" data-filter="pension">
      <button data-pension="all" class="active">All</button>
      <button data-pension="yes">🏛️ Pension</button>
    </div>
    <select id="salary-filter">
      <option value="0">All salaries</option>
      <option value="80000">$80K+</option>
      <option value="100000">$100K+</option>
    </select>
    <select id="sort">
      <option value="score">Sort: Best match</option>
      <option value="salary_max">Sort: Salary (high→low)</option>
      <option value="date">Sort: Newest first</option>
      <option value="title">Sort: A–Z</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="jobs-table">
      <thead>
        <tr>
          <th data-sort="status" style="width: 50px;"></th>
          <th data-sort="title">Role</th>
          <th data-sort="source" class="hide-mobile" style="width: 90px;">Source</th>
          <th data-sort="company" class="hide-mobile">Company</th>
          <th data-sort="location" class="hide-mobile">Location</th>
          <th data-sort="salary_max" style="width: 130px;">Salary</th>
          <th data-sort="date" class="hide-mobile" style="width: 110px;">Posted</th>
          <th data-sort="score" style="width: 100px;">Match</th>
        </tr>
      </thead>
      <tbody id="jobs-tbody">
        <tr><td colspan="8" class="empty">Loading jobs…</td></tr>
      </tbody>
    </table>
  </div>

  <footer role="contentinfo">Built by <a href="https://nlkauto.com" target="_blank" rel="noopener noreferrer">NLK Automation</a></footer>
</div>

<script>
let ALL_JOBS = [];
let FILTER = { status: 'all', source: 'all', search: '', salary: 0, sort: 'score', pension: 'all' };

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function salaryBadge(max) {
  if (!max || max === 0) return { class: 'badge-na', text: '—' };
  if (max >= 100000) return { class: 'badge-100k', text: '💰💰 $' + max.toLocaleString() };
  if (max >= 80000) return { class: 'badge-75k', text: '💰 $' + max.toLocaleString() };
  return { class: 'badge-under', text: '💸 $' + max.toLocaleString() };
}

function render() {
  let jobs = ALL_JOBS.slice();
  if (FILTER.status !== 'all') jobs = jobs.filter(j => j.status === FILTER.status);
  if (FILTER.source !== 'all') jobs = jobs.filter(j => (j.source || 'LinkedIn') === FILTER.source);
  if (FILTER.pension === 'yes') jobs = jobs.filter(j => j.pension === true);
  if (FILTER.search) {
    const q = FILTER.search.toLowerCase();
    jobs = jobs.filter(j =>
      j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q)
    );
  }
  if (FILTER.salary > 0) {
    jobs = jobs.filter(j => j.salary_annual_max >= FILTER.salary);
  }
  if (FILTER.sort === 'score') jobs.sort((a, b) => b.score - a.score);
  else if (FILTER.sort === 'salary_max') jobs.sort((a, b) => b.salary_annual_max - a.salary_annual_max);
  else if (FILTER.sort === 'date') {
    const d = (s) => {
      s = (s || '').toLowerCase();
      if (s.includes('hour')) return 0.01;
      if (s.includes('day')) {
        const m = s.match(/(\d+)/); return m ? parseInt(m[1]) : 1;
      }
      if (s.includes('week')) {
        const m = s.match(/(\d+)/); return m ? parseInt(m[1]) * 7 : 7;
      }
      if (s.includes('month')) {
        const m = s.match(/(\d+)/); return m ? parseInt(m[1]) * 30 : 30;
      }
      return 999;
    };
    jobs.sort((a, b) => d(a.date) - d(b.date));
  } else if (FILTER.sort === 'title') jobs.sort((a, b) => a.title.localeCompare(b.title));

  const tbody = $('#jobs-tbody');
  if (jobs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No jobs match your filters.</td></tr>';
    return;
  }
  tbody.innerHTML = jobs.map((j) => {
    const sb = salaryBadge(j.salary_annual_max);
    const newBadge = j.status === 'new' ? '<span class="new-badge">NEW</span>' : '';
    const pensionBadge = j.pension ? '<span class="pension-badge">🏛️ PENSION</span>' : '';
    const matchPct = Math.min(100, j.score);
    const matchFill = `width: ${matchPct}%`;
    const srcKey = (j.source || 'linkedin').toLowerCase().replace(/[^a-z]/g, '');
    return `
      <tr class="${j.status === 'new' ? 'is-new' : ''}" data-url="${j.url}">
        <td>${newBadge}</td>
        <td class="role-cell">
          <a href="${j.url}" target="_blank" rel="noopener" data-row-link>${escape(j.title)}</a>${pensionBadge}
        </td>
        <td class="source-cell hide-mobile"><span class="source-badge source-${srcKey}">${escape(j.source || 'LinkedIn')}</span></td>
        <td class="company-cell hide-mobile">${escape(j.company || '—')}</td>
        <td class="loc-cell hide-mobile">${escape(j.location || '—')}</td>
        <td class="salary-cell"><span class="badge ${sb.class}">${sb.text}</span></td>
        <td class="date-cell hide-mobile">${escape(j.date || '—')}</td>
        <td class="match-cell">
          <span class="match-bar"><span class="match-bar-fill" style="${matchFill}"></span></span>
          <span class="match-num">${j.score}</span>
        </td>
      </tr>
    `;
  }).join('');

  tbody.querySelectorAll('tr[data-url]').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('a[data-row-link]')) return;
      window.open(tr.dataset.url, '_blank', 'noopener');
    });
  });
}

function escape(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderStats(summary) {
  const items = [
    { num: summary.total_relevant, label: 'Total Jobs' },
    { num: summary.new_count, label: 'New This Week' },
    { num: summary.ongoing_count, label: 'Ongoing' },
    { num: summary.pension_count || 0, label: 'Pension / Public' },
    { num: summary.over_100k, label: '$100K+' },
    { num: summary.over_80k, label: '$80K+' },
    { num: summary.salary_known, label: 'Salary Listed' },
  ];
  $('#stats').innerHTML = items.map(i => `
    <div class="stat">
      <div class="num">${i.num}</div>
      <div class="label">${i.label}</div>
    </div>
  `).join('');
}

function formatUpdated(iso) {
  try {
    const d = new Date(iso);
    return 'Updated ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
      ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  } catch { return iso; }
}

async function load() {
  try {
    const res = await fetch('rodrigo-jobs.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    ALL_JOBS = data.jobs || [];
    renderStats(data.summary || {});
    $('#updated').textContent = formatUpdated(data.generated_at);
    render();
  } catch (e) {
    $('#updated').textContent = '⚠️ ' + e.message;
    $('#jobs-tbody').innerHTML =
      '<tr><td colspan="8" class="empty">No job data yet. Run the weekly scan first.</td></tr>';
  }
}

$('#search').addEventListener('input', e => { FILTER.search = e.target.value; render(); });
$$('.filter-group').forEach(group => {
  const filterType = group.dataset.filter;
  group.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      group.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (filterType === 'status') FILTER.status = b.dataset.status;
      else if (filterType === 'source') FILTER.source = b.dataset.source;
      else if (filterType === 'pension') FILTER.pension = b.dataset.pension;
      render();
    });
  });
});
$('#salary-filter').addEventListener('change', e => { FILTER.salary = parseInt(e.target.value); render(); });
$('#sort').addEventListener('change', e => { FILTER.sort = e.target.value; render(); });

$$('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (field === 'status' || field === 'location') return;
    const sel = $('#sort');
    const mapping = {
      title: 'title', date: 'date', salary_max: 'salary_max', score: 'score'
    };
    if (mapping[field]) {
      sel.value = mapping[field];
      FILTER.sort = mapping[field];
      render();
    }
  });
});

load();
</script>
</body>
</html>
