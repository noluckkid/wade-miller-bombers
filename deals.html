  .card {

  .card .img .ph { color: var(--muted); font-size: 12px; }

  .card .pricing { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .card .was { font-size: 12px; color: var(--muted); text-decoration: line-through; font-family: var(--mono); }
  .card .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-family: var(--mono); font-weight: 600; }
  .badge.sale { background: rgba(74, 222, 128, 0.12); color: var(--ok); border: 1px solid rgba(74, 222, 128, 0.3); }

  .badge.hot { background: rgba(248, 113, 113, 0.12); color: var(--hot); border: 1px solid rgba(248, 113, 113, 0.3); }
  .card .discount { font-size: 13px; color: var(--accent); font-family: var(--mono); font-weight: 600; }
  .card .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-top: auto; }
  .card .src { font-family: var(--mono); }
  .card a.open { color: var(--accent); text-decoration: none; font-size: 12px; }
  .card a.open:hover { text-decoration: underline; }
  .empty { padding: 60px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  footer code { font-family: var(--mono); color: var(--accent); }

<script>
  const $ = (s, c=document) => c.querySelector(s);
  const $$ = (s, c=document) => Array.from(c.querySelectorAll(s));

  let ALL = [];

  async function load() {
    // Prefer embedded data (avoids CSP fetch issues) — fall back to fetch on auto-refresh
    if (window.__DEALS__ && !window.__forceFetch) {
      ALL = window.__DEALS__;
      if (!Array.isArray(ALL)) ALL = ALL.deals || ALL.results || [];
      bootstrap();
    } else {
      const res = await fetch('deals.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load deals.json: ' + res.status);
      ALL = await res.json();
      if (!Array.isArray(ALL)) ALL = ALL.deals || ALL.results || [];
      bootstrap();
    }
    if (window.__nlkAutoRefresh) clearInterval(window.__nlkAutoRefresh);
    window.__nlkAutoRefresh = setInterval(() => {
      window.__forceFetch = true;
      load();
    }, 5 * 60 * 1000); // 5 min
  }

  function bootstrap() {
    // Stats
    const sources = {};
    let totalDiscount = 0, hotCount = 0, maxD = 0;
    ALL.forEach(d => {
      const s = d.source || 'unknown';
      sources[s] = (sources[s] || 0) + 1;
      const dp = d.discount_pct || d.computed_discount_pct || 0;
      totalDiscount += dp;
      if (dp >= 30) hotCount++;
      if (dp > maxD) maxD = dp;
    });
    const avg = ALL.length ? (totalDiscount / ALL.length).toFixed(1) : 0;
    $('#stats').innerHTML = `
      <div class="stat"><div class="label">Deals</div><div class="val gold">${ALL.length.toLocaleString()}</div></div>
      <div class="stat"><div class="label">Avg Discount</div><div class="val">${avg}%</div></div>
      <div class="stat"><div class="label">Hot (30%+)</div><div class="val green">${hotCount}</div></div>
      <div class="stat"><div class="label">Sources</div><div class="val">${Object.keys(sources).length}</div></div>
    `;
    // Source filter
    const sel = $('#source');
    Object.keys(sources).sort().forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = `${s} (${sources[s]})`;
      sel.appendChild(o);
    });
    // Meta: latest scrape time
    const latest = ALL.reduce((acc, d) => {
      const t = d.scraped_at || d.timestamp;
      return t && t > acc ? t : acc;
    }, '');
    $('#meta').textContent = latest ? `latest scrape: ${latest.replace('T',' ').slice(0,16)} UTC` : '';
    render();
  }

  function render() {
    const q = $('#q').value.toLowerCase().trim();
    const src = $('#source').value;
    const sort = $('#sort').value;
    let list = ALL.filter(d => {
      if (src && d.source !== src) return false;
      if (!q) return true;
      const hay = `${d.title||''} ${d.brand||''} ${d.source_sku||''} ${d.upc||''} ${d.model_number||''}`.toLowerCase();
      return hay.includes(q);
    });
    const dp = d => d.discount_pct || d.computed_discount_pct || 0;
    const p = d => d.sale_price || d.current_price || d.best_price || 0;
    const name = d => (d.title||'').toLowerCase();
    list.sort((a, b) => {
      switch (sort) {
        case 'discount_asc': return dp(a) - dp(b);
        case 'price_asc': return p(a) - p(b);
        case 'price_desc': return p(b) - p(a);
        case 'name_asc': return name(a).localeCompare(name(b));
        default: return dp(b) - dp(a);
      }
    });

    const grid = $('#grid');
    if (!list.length) {
      grid.innerHTML = '<div class="empty">No deals match your filters.</div>';
      return;
    }
    grid.innerHTML = list.slice(0, 240).map(d => {
      const price = d.sale_price || d.current_price || d.best_price;
      const was = d.regular_price;
      const dpct = d.discount_pct || d.computed_discount_pct || 0;
      const badge = d.is_rollback
        ? '<span class="badge rollback">Rollback</span>'
        : (d.is_clearance ? '<span class="badge hot">Clearance</span>' : (d.badge_text ? `<span class="badge sale">${esc(d.badge_text)}</span>` : ''));
      const hot = dpct >= 30 ? ' <span class="badge hot">🔥 ' + dpct + '%</span>' : '';
      const imgRaw = d.image_url;
      const img = imgRaw
        ? `<img src="${imgRaw}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'ph\\'>no image</span>'">`
        : '<span class="ph">no image</span>';
      const url = d.source_url || '#';
      return `
        <div class="card">
          <div class="img">${img}</div>
          <div class="body">
            <div class="title">${esc(d.title || '—')}</div>
            <div>
              ${badge}${hot}
            </div>
            <div class="pricing">
              <span class="now">$${fmt(price)}</span>
              ${was ? `<span class="was">$${fmt(was)}</span>` : ''}
              ${dpct ? `<span class="discount">−${dpct}%</span>` : ''}
            </div>
            <div class="row">
              <span class="src">${esc(d.source || '')}</span>
              <a class="open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">View ↗</a>
            </div>
          </div>
        </div>
      `;
    }).join('');
    if (list.length > 240) {
      grid.innerHTML += `<div class="empty">Showing 240 of ${list.length}. Refine with filters to see more.</div>`;
    }
  }

  function fmt(n) { return n == null ? '—' : Number(n).toFixed(2); }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  ['q','source','sort'].forEach(id => {
    const el = $('#' + id);
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  $('#ts').textContent = new Date().toLocaleString();

  // Countdown to next refresh
  const REFRESH_MS = 5 * 60 * 1000;
  let nextAt = Date.now() + REFRESH_MS;
  setInterval(() => {
    const s = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
    const m = Math.floor(s / 60), r = s % 60;
    $('#next').textContent = m > 0 ? `${m}m ${r}s` : `${r}s`;
    if (s <= 0) nextAt = Date.now() + REFRESH_MS;
  }, 1000);

  load().catch(err => {
    $('#grid').innerHTML = `<div class="empty">⚠ ${esc(err.message)}</div>`;
  });
</script>
