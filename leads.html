<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — Wade Miller Bombers</title>
<style>
:root{--gold:#d4af37;--gold-l:#f0e6c0;--teal:#06b6d4;--navy:#000212;--dark:#0a0e17;--card:#0f172a;--bd:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--dim:#7c8db0;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--navy);color:var(--txt);min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:rgba(0,2,18,.95);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
nav .logo{font-weight:800;font-size:16px;letter-spacing:1px}
nav .logo span{background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,#b8960f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px}
nav a:hover{color:var(--gold);border-color:var(--gold)}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:26px;font-weight:800;background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,#b8960f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stat .n{font-size:24px;font-weight:800;color:var(--gold);line-height:1.1}
.stat .n.up{color:var(--green)}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.search{width:100%;background:var(--card);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:16px;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--gold)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{background:var(--card);border:1px solid var(--bd);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.fbtn.on{color:var(--gold);border-color:var(--gold);background:rgba(212,175,55,.08)}
.lead{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.lead.test{opacity:.55}
.lead .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.lead .name{font-size:17px;font-weight:700}
.lead .time{font-size:12px;color:var(--dim);white-space:nowrap}
.lead .email{color:var(--teal);font-size:14px;margin-bottom:6px;word-break:break-all}
.lead .msg{color:var(--txt);font-size:15px;line-height:1.45;white-space:pre-wrap;display:none;border-top:1px solid var(--bd);padding-top:8px;margin-top:2px}
.lead.open .msg{display:block}
.lead .meta{font-size:11px;color:var(--dim);margin-top:8px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.badge.test{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.35)}
.badge.new{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.35)}
.tap{color:var(--dim);font-size:11px;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:15px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--green);margin-top:2px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<nav>
  <div class="logo">WMB <span>LEADS</span></div>
  <a href="/">← Site</a>
</nav>
<div class="wrap">
  <h1>Contact Form Leads</h1>
  <div class="sub" id="sub">—</div>
  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat"><div class="n up" id="sToday">0</div><div class="l">Today</div></div>
    <div class="stat"><div class="n" id="sWeek">0</div><div class="l">7 Days</div></div>
  </div>
  <input class="search" id="q" type="search" placeholder="Search name, email, message…">
  <div class="filters" id="filters">
    <button class="fbtn on" data-f="all">All</button>
    <button class="fbtn" data-f="real">Real</button>
    <button class="fbtn" data-f="test">Test</button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
  <div class="live"><span class="dot"></span>auto-refresh 30s</div>
</div>
<script>
var ALL=[],F='all',Q='';
var TEST_RE=/test|spam|audit|poop|^a@|^t@t|^x@|^yo@|probe|ignore|^1$|^2$|verify|nlk\.ca|example\.com|bod\.com|test\.com/;
function isTest(l){
  var s=(l.name||'')+' '+(l.email||'')+' '+(l.message||'');
  if(/@(a|t|x|yo)\.(com|to)$/.test(l.email||''))return true;
  return TEST_RE.test(s.toLowerCase());
}
function fmtTime(ts){
  if(!ts)return '';
  var d=new Date(ts);
  if(isNaN(d))return ts.slice(0,16);
  return d.toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  var today=new Date();today.setHours(0,0,0,0);
  var wk=new Date();wk.setDate(wk.getDate()-7);
  var t=ALL.length,td=0,w=0;
  ALL.forEach(function(l){var d=new Date(l.timestamp||0);if(d>=today)td++;if(d>=wk)w++});
  document.getElementById('sTotal').textContent=t;
  document.getElementById('sToday').textContent=td;
  document.getElementById('sWeek').textContent=w;
  var rows=ALL.filter(function(l){
    var test=isTest(l);
    if(F==='real'&&test)return false;
    if(F==='test'&&!test)return false;
    if(Q){
      var hay=(l.name+' '+l.email+' '+l.message).toLowerCase();
      if(hay.indexOf(Q)<0)return false;
    }
    return true;
  });
  var el=document.getElementById('list');
  if(!rows.length){el.innerHTML='<div class="empty">'+(ALL.length?'No matches':'No submissions yet')+'</div>';return}
  el.innerHTML=rows.map(function(l){
    var test=isTest(l);
    return '<div class="lead'+(test?' test':'')+(l._new?' new':'')+'" onclick="this.classList.toggle(\'open\')">'
      +'<div class="top"><span class="name">'+esc(l.name)+'</span><span class="time">'+fmtTime(l.timestamp)+'</span></div>'
      +'<div class="email">'+esc(l.email)+(test?'<span class="badge test">TEST</span>':'<span class="badge new">REAL</span>')+'</div>'
      +'<div class="msg">'+esc(l.message||'(no message)')+'</div>'
      +'<div class="tap">tap to '+(l._open?'close':'expand')+' message</div>'
      +'<div class="meta">'+esc(l.ip||'')+(l.ua?' · '+esc(String(l.ua).slice(0,60)):'')+'</div>'
      +'</div>';
  }).join('');
}
function load(){
  fetch('/leads-data',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    ALL=(d||[]).slice().reverse();
    render();
    var last=ALL[0]&&ALL[0].timestamp;
    document.getElementById('sub').textContent=(last?('Last: '+fmtTime(last)):'No submissions')+' · '+(ALL.length)+' total';
  }).catch(function(){document.getElementById('list').innerHTML='<div class="empty">Could not load — auth failed?</div>'});
}
document.getElementById('q').addEventListener('input',function(e){Q=e.target.value.trim().toLowerCase();render()});
document.querySelectorAll('.fbtn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');F=b.dataset.f;render();
})});
load();setInterval(load,30000);
</script>
<footer style="text-align:center;padding:16px 20px;color:var(--muted);font-size:12px"><div style="color:var(--muted);font-size:12px;margin-top:2px"><a href="https://nlkauto.com" target="_blank" rel="noopener noreferrer" style="color:var(--gold);text-decoration:none">We build these for businesses too →</a></div></footer>
</body>
</html>
